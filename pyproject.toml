[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentprobe-lab"
version = "0.1.0"
description = "An inspectable LLM agent security regression lab"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentprobe = "agentprobe.cli:main"

[tool.setuptools.packages.find]
include = ["agentprobe*"]

[tool.setuptools.package-data]
agentprobe = ["cases.json"]
